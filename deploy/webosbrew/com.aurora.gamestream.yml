description: |
  **Eclipse** is a game-streaming client for LG webOS, derived from
  [Moonlight TV](https://github.com/mariotaku/moonlight-tv). Stream from an Umbra, Apollo
  or Sunshine host. Supported resolution, frame rate and HDR depend on your TV and host.

  ![GitHub Release](https://img.shields.io/github/v/release/PreceptorOfMagic/Eclipse)
  ![GitHub Downloads](https://img.shields.io/github/downloads/PreceptorOfMagic/Eclipse/total)

  ## Notes

  * App ID: `com.aurora.gamestream` (separate from store / Homebrew **Moonlight** `com.limelight.webos`).
  * Releases: [github.com/PreceptorOfMagic/Eclipse/releases](https://github.com/PreceptorOfMagic/Eclipse/releases)

  ## Highlights

  * High bitrate option (up to 300 Mbps — use responsibly on Wi‑Fi).
  * HDR10 (PQ) over HEVC Main10 or AV1 Main10 when the host sends HDR.
  * Optional **Tight display sync** (webOS Starfish) and optional **AV1** in Settings → Video.
