/*
 * The Android package around the native program. The native libraries and the assets are NOT built here:
 * scripts/android/build_apk.sh builds them with CMake for each ABI (as every other platform builds its
 * binaries) and stages them under build/android-stage; this project only compiles the activity and SDL's Java
 * half and packages the APK. See docs/BUILD_ANDROID.md.
 */
plugins {
    id 'com.android.application'
}

def repoRoot = rootProject.file('../..')
def depsDir = System.getenv('ECLIPSE_ANDROID_DEPS') ?: new File(repoRoot, 'build/android-deps').path
def stageDir = System.getenv('ECLIPSE_ANDROID_STAGE') ?: new File(repoRoot, 'build/android-stage').path

/* The version is the project's own (CMakeLists.txt project(... VERSION x.y.z)), never a second copy. */
def projectVersion = {
    def m = (new File(repoRoot, 'CMakeLists.txt').text =~ /project\(moonlight VERSION (\d+)\.(\d+)\.(\d+)/)
    if (!m.find()) {
        throw new GradleException('No project version in CMakeLists.txt')
    }
    [m.group(1) as int, m.group(2) as int, m.group(3) as int]
}()

android {
    namespace 'io.github.preceptorofmagic.eclipse'
    compileSdk 35

    defaultConfig {
        applicationId System.getenv('ECLIPSE_ANDROID_APPLICATION_ID') ?: 'io.github.preceptorofmagic.eclipse'
        minSdk 28
        targetSdk 35
        versionName "${projectVersion[0]}.${projectVersion[1]}.${projectVersion[2]}"
        versionCode projectVersion[0] * 10000 + projectVersion[1] * 100 + projectVersion[2]
    }

    /* Sideloaded builds are signed with the project's own key (keep it: an APK signed with another key cannot
     * update an installed one). Without the four variables a release build is signed with the debug key and
     * build_apk.sh names it accordingly. */
    signingConfigs {
        release {
            def keystore = System.getenv('ECLIPSE_ANDROID_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ECLIPSE_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ECLIPSE_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ECLIPSE_ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ECLIPSE_ANDROID_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["${depsDir}/sdl-java"]
            jniLibs.srcDirs = ["${stageDir}/jniLibs"]
            assets.srcDirs = ["${stageDir}/assets"]
        }
    }

    packaging {
        jniLibs {
            /* Extracted into the native library directory: the co-op peer is EXECUTED from there
             * (libeclipse_peer.so, src/app/platform/android/path_android.c). */
            useLegacyPackaging = true
            /* Stripped by build_apk.sh, which also keeps the unstripped copies for crash symbolication. */
            keepDebugSymbols += ['**/*.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
