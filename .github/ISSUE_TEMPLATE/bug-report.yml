name: Bug report
description: Report a reproducible client, stream, input, audio, video, or co-op problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. This project is still an engineering preview, so exact build and hardware details matter.

        Do not include pairing codes, account details, public IP addresses, host UUIDs, or unredacted logs/screenshots. Host-only capture, encoder, pairing, virtual-display, service, installer, or web-interface problems belong in the [Umbra tracker](https://github.com/PreceptorOfMagic/umbra/issues). Optional Pi/device-hub and USB/IP problems belong in the [CTM-USBIP tracker](https://github.com/PreceptorOfMagic/CTM-USBIP/issues). For stock Moonlight questions that do not reproduce in this fork, use the upstream community link shown on the new-issue page.

  - type: dropdown
    id: session_type
    attributes:
      label: Session type
      description: Which path shows the problem?
      options:
        - Single-host stream
        - Two-host co-op — side by side
        - Two-host co-op — stacked
        - Windows client also hosts one co-op pane
        - Client UI or setup before streaming
        - Other
    validations:
      required: true

  - type: input
    id: client_build
    attributes:
      label: Client build
      description: Give the release tag, package filename, commit hash, or exact source branch used.
      placeholder: "Example: commit abc1234 from the default branch"
    validations:
      required: true

  - type: dropdown
    id: client_platform
    attributes:
      label: Client platform
      options:
        - LG webOS TV
        - Windows x64
        - Linux desktop
        - Other source build
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device model and OS
      description: Include the model, operating-system version, and relevant GPU/driver where applicable.
      placeholder: "Example: LG TV model and webOS version, or PC GPU and driver version"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Host information

        For co-op, describe both hosts separately. Do not include fixed network addresses or identifiers.

  - type: dropdown
    id: host_software
    attributes:
      label: Host software
      options:
        - Umbra
        - Apollo (upstream)
        - Sunshine
        - Other Moonlight-compatible host
        - Not applicable
    validations:
      required: true

  - type: input
    id: host_build
    attributes:
      label: Host build
      description: Give the release tag, commit hash, or exact branch for the host software.
      placeholder: "Example: Umbra commit abc1234"

  - type: textarea
    id: host_setup
    attributes:
      label: Host hardware and configuration
      description: List the CPU, GPU, driver, operating system, display path, and any virtual-display use for each host.
      placeholder: |
        Host 1: hardware, driver, OS, display path
        Host 2 (co-op only): hardware, driver, OS, display path
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Problem

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what was visible or audible, when it began, and whether one or both panes were affected.
      placeholder: "Example: The second pane stayed black after launch while the first pane continued updating."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest repeatable sequence, including selected layout and input assignment when relevant.
      placeholder: |
        1. Pair both hosts
        2. Select the co-op entry
        3. Choose the layout and input ownership
        4. Launch and observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: State what should have happened instead.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Attach a photo or screenshot of the actual client display and the smallest relevant log excerpt. Include timestamps, and say if the image contradicts the counters.
      placeholder: "Drag files here after removing personal, account, pairing, network, and machine-identifying information."

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this symptom.
          required: true
        - label: I removed credentials, pairing codes, account information, network addresses, host IDs, and other private data.
          required: true
        - label: If this is stream-related, I reproduced it against a live host rather than prerecorded playback.
          required: true
