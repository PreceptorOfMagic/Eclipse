name: Build (Android)

on:
  push:
    tags-ignore:
      - 'v*.*.*'
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe Android toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: Report SDK, NDK and emulator support
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-} ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-} ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          ls "${ANDROID_SDK_ROOT}/ndk" || true
          ls "${ANDROID_SDK_ROOT}/platforms" "${ANDROID_SDK_ROOT}/build-tools" || true
          ls -l /dev/kvm || echo "no /dev/kvm"
          java -version 2>&1 | head -1
          cmake --version | head -1
