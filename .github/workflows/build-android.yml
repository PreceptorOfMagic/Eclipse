name: Build (Android)

on:
  push:
    tags-ignore:
      - 'v*.*.*'
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The NDK every Android build uses (docs/BUILD_ANDROID.md).
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    name: Package (NVIDIA SHIELD APK, unsigned key)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install build tools
        run: |
          sudo apt-get -yq update
          sudo apt-get -y -qq install ninja-build gettext pkg-config

      - name: Install the Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" \
            "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache the built dependencies
        uses: actions/cache@v4
        with:
          path: build/android-deps
          key: android-deps-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/android/build_deps.sh', 'scripts/linux/portable/patches/**') }}

      - name: Build the APK (arm64-v8a, armeabi-v7a, x86_64)
        run: ./scripts/android/build_apk.sh

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-android
          path: |
            dist/eclipse-android*.apk
            dist/eclipse-android*.apk.sha256
          if-no-files-found: error

      - name: Upload the native symbols
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-android-symbols
          path: build/android-symbols
          if-no-files-found: error

      - name: Build the self-test APK (x86_64)
        run: ./scripts/android/build_apk.sh --selftest --abi x86_64

      - name: Upload the self-test APK
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-android-selftest
          path: dist/eclipse-android-selftest.apk
          if-no-files-found: error

  emulator:
    name: Smoke tests (emulator, Android 11, x86_64)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install FFmpeg
        run: |
          sudo apt-get -yq update
          sudo apt-get -y -qq install ffmpeg

      - name: Build the co-op splice tool
        run: >-
          cc -O2 -o hevc_tilecols tests/coop/hevc_tilecols_cli.c src/app/stream/video/coop_splice.c
          src/app/stream/video/coop_poc.c -Isrc/app/stream/video

      - name: Download the self-test APK
        uses: actions/download-artifact@v4
        with:
          name: eclipse-android-selftest
          path: selftest

      - name: Run the smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: tests/android/device_smoke.sh selftest/eclipse-android-selftest.apk ./hevc_tilecols smoke

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: |
            smoke/*.png
            smoke/*.txt
          if-no-files-found: ignore
