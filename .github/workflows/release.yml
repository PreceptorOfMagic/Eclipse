name: Release
run-name: "Release ${{ github.event.release.tag_name }}"

on:
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release

jobs:
  release-windows:
    # PUBLIC-LAUNCH GATE: remove only after the artifact-specific licence,
    # corresponding-source, naming, and release checks are complete.
    if: ${{ false }}
    name: Release (Windows x64, unsigned)
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up MSYS2 MinGW64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          suppress-deprecation-warnings: msystem-mingw64
          install: mingw-w64-x86_64-nsis

      - name: Build unsigned portable package
        shell: pwsh
        run: >-
          ./scripts/windows/build_portable.ps1
          -Clean
          -RequireCleanTree
          -Configuration RelWithDebInfo
          -MsysRoot '${{ steps.msys2.outputs.msys2-location }}'

      - name: Build per-user Windows installer
        shell: pwsh
        run: >-
          ./scripts/windows/build_installer.ps1
          -Makensis '${{ steps.msys2.outputs.msys2-location }}/mingw64/bin/makensis.exe'

      - name: Attach unsigned Windows package
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifactErrorsFailBuild: true
          artifacts: dist/eclipse-windows-x64-setup-unsigned.exe,dist/eclipse-windows-x64-setup-unsigned.exe.sha256,dist/eclipse-windows-x64-unsigned.zip,dist/eclipse-windows-x64-unsigned.zip.sha256

  release-android:
    # PUBLIC-LAUNCH GATE: remove only after the APK's licence, notice and corresponding-source material has
    # been reviewed and the project's Android signing key exists (docs/BUILD_ANDROID.md, "Signing").
    if: ${{ false }}
    name: Release (NVIDIA SHIELD APK)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build tools
        run: |
          sudo apt-get -yq update
          sudo apt-get -y -qq install ninja-build gettext pkg-config

      - name: Install the Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" \
            "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ECLIPSE_ANDROID_KEYSTORE_BASE64 }}
          ECLIPSE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ECLIPSE_ANDROID_KEYSTORE_PASSWORD }}
          ECLIPSE_ANDROID_KEY_ALIAS: ${{ secrets.ECLIPSE_ANDROID_KEY_ALIAS }}
          ECLIPSE_ANDROID_KEY_PASSWORD: ${{ secrets.ECLIPSE_ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "the release signing key is not configured" >&2; exit 1; }
          export ECLIPSE_ANDROID_KEYSTORE="$RUNNER_TEMP/eclipse-release.jks"
          base64 -d <<<"$KEYSTORE_BASE64" > "$ECLIPSE_ANDROID_KEYSTORE"
          ./scripts/android/build_apk.sh --clean --require-clean-tree
          rm -f "$ECLIPSE_ANDROID_KEYSTORE"
          tar -C build -czf dist/eclipse-android-symbols.tar.gz android-symbols

      - name: Attach the Android package
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifactErrorsFailBuild: true
          artifacts: dist/eclipse-android.apk,dist/eclipse-android.apk.sha256,dist/eclipse-android-symbols.tar.gz

  release-webos:
    # PUBLIC-LAUNCH GATE: the current IPK does not yet carry the complete
    # release-specific licence/notice/source material.
    if: ${{ false }}
    name: Release (webOS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download ares-cli-rs
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/ares-cli-rs"
          latest: true
          fileName: "ares-package_*.deb"
          out-file-path: "temp"

      - name: Download Manifest Generator
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/dev-toolbox-cli"
          latest: true
          fileName: "webosbrew-toolbox-gen-manifest_*.deb"
          out-file-path: "temp"

      - name: Update Packages
        run: sudo apt-get -yq update

      - name: Install webOS CLI
        run: sudo apt-get install ./temp/*.deb

      - name: webOS Build
        uses: ./.github/actions/build-webos
        with:
          build-type: RelWithDebInfo

      - name: Create Release (webOS)
        id: create_release_webos
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifacts: dist/*.ipk,dist/*_dbgsym.tar.gz,dist/*.manifest.json

  release-raspi:
    # PUBLIC-LAUNCH GATE: inherited packaging and notices require review.
    if: ${{ false }}
    name: Release (Raspberry Pi ${{ matrix.arch }})
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        arch: [ armhf, arm64 ]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Prepare Client Dependencies
        run: ./scripts/bootstrap_client_deps.sh

      - name: Update Packages
        shell: bash
        run: sudo apt-get -yq update

      - name: Prepare Sysroot
        id: pi-sysroot
        uses: mariotaku/raspbian-sysroot-action@v1.3
        with:
          release: bookworm
          packages: ${{github.workspace}}/scripts/raspi/sysroot-packages.list
          arch: ${{ matrix.arch }}

      - name: Install Build Tools
        shell: bash
        run: sudo apt-get -y -qq install crossbuild-essential-${{ matrix.arch }} cmake gettext

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DTARGET_RASPI=ON
          -DCMAKE_TOOLCHAIN_FILE=${{steps.pi-sysroot.outputs.cmake-toolchain}}

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE

      - name: Package
        working-directory: ${{github.workspace}}/build
        run: cpack

      - name: Create Release (Raspberry Pi)
        id: create_release_raspi
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifacts: build/*.deb

  release-steamlink:
    # PUBLIC-LAUNCH GATE: inherited packaging and notices require review.
    if: ${{ false }}
    name: Release (Steam Link)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Prepare Client Dependencies
        run: ./scripts/bootstrap_client_deps.sh

      - name: Install Steam Link SDK
        uses: ./.github/actions/steamlink-sdk
        with:
          path: .steamlink-sdk

      - name: Install Build Tools
        shell: bash
        run: sudo apt-get -y -qq install cmake gettext

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |
          source ${{github.workspace}}/.steamlink-sdk/setenv.sh
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        env:
          CMAKE_TOOLCHAIN_FILE: ${{github.workspace}}/.steamlink-sdk/toolchain/steamlink-toolchain.cmake

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          source ${{github.workspace}}/.steamlink-sdk/setenv.sh
          cmake --build . --config $BUILD_TYPE
          cpack

      - name: Create Release (Steam Link)
        id: create_release_steamlink
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifacts: dist/moonlight-tv_*_steamlink.*
